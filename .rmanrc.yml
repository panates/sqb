# Quoted because YAML reads a bare leading `@` as a reserved indicator and refuses the file.
extends: '@panates/rman-preset'

changelog:
  # How far back a changelog goes - the 4.x line and newer.
  #
  # Unmarked on purpose, so it reaches the repository root as well as the packages. Under `"[*]"`
  # the root would have no floor of its own.
  startingAt: v4.0.0

'[platform:node]':
  '[*]':
    # All seventeen packages release together, under one version and one `v*` tag.
    #
    # It has to sit inside this selector block: the preset sets `group: false` in its own `"[*]"`,
    # and a selector always beats an unmarked key - written at the top level this would silently
    # lose, giving seventeen separate version lines.
    group: true

    version:
      # Keep them on the same number even when only some of them changed.
      #
      # Without this, a fix in a package nothing depends on - `migrator` or `nestjs` - bumps that
      # one alone, and the version line is split for good.
      cascade: group
