# pnpm reads its workspace from here; rman still reads package.json's
# "workspaces", so the two list the same packages.
packages:
  - 'packages/*'
allowBuilds:
  '@swc/core': false
  oracledb: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@types/node@26.6.6'
  - postgrejs@3.14.1
  - valgen@7.0.6
