# pnpm and rman (since 2.39.0) read the workspace packages from here.
packages:
  - 'packages/*'
allowBuilds:
  '@swc/core': false
  oracledb: false
  unrs-resolver: false
# pnpm holds back versions published less than a day ago by default;
# this repository takes them as soon as they are out.
minimumReleaseAge: 0
