# pnpm reads its workspace from here; rman still reads package.json's
# "workspaces", so the two list the same packages.
packages:
  - 'packages/*'
allowBuilds:
  '@swc/core': false
  oracledb: false
  unrs-resolver: false
# pnpm holds back versions published less than a day ago by default;
# this repository takes them as soon as they are out.
minimumReleaseAge: 0
